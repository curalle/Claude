      body {

      /* Camera wrapper: anchored at the top so the base reframe pushes the

      #cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #cam-inner {
        position: absolute;
        inset: 0;

      #shade {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;

        left: 0;
        right: 0;
        top: 170px;

        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 0 70px;

      #hook .tag {
        display: block;
        background: var(--accent);
        color: var(--paper);
        font-weight: 900;
        font-size: 34px;

        text-transform: uppercase;
        padding: 12px 26px;
        border-radius: 8px;

        color: var(--navy);

        text-transform: uppercase;

        left: 0;
        right: 0;
        top: 1250px;
        height: 330px;
      }

        left: 0;
        right: 0;
        top: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: flex-start;
        gap: 6px 14px;
        padding: 0 80px;
        opacity: 0;
        overflow: visible;

      .w {

        position: relative;
        color: var(--paper);
        font-weight: 900;
        font-size: 64px;
        line-height: 1.12;
        white-space: nowrap;
        text-transform: uppercase;
        padding: 2px 14px 6px;
        border-radius: 12px;

        paint-order: stroke fill;
        text-shadow: 0 6px 18px rgba(19, 28, 63, 0.55);
      }
      .w .hl {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: var(--accent);
        opacity: 0;
        display: block;
      }
      .w .tx {
        position: relative;
      }

      /* Progress bar */
      #progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: rgba(19, 28, 63, 0.45);
      }
      #progress .bar {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: 0% 50%;
      }

      /* Outro */
      #outro {
        position: absolute;
        left: 0;
        right: 0;
        top: 250px;
        display: flex;
        justify-content: center;
        padding: 0 80px;
